<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Product preview card component</title>
</head>
<body>
  <main class="card">
    <picture class="card__picture">
      <source media="(min-width: 600px)" srcset="images/image-product-desktop.jpg">

      <img class="card__image" src="images/image-product-mobile.jpg" alt="Gabrielle Essence Eau De Parfum">
    </picture>
    <div class="card__content">
      <section class="card__info">
        <p class="card__label">PERFUME</p>
        <h1 class="card__title">Gabrielle Essence Eau De Parfum</h1>
        <p class="card__description">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>
      </section>

      <div class="card__price">
        <span class="card__price-new">$149.99</span>
        <del class="card__price-old">$169.99</del>
      </div>

      <button class="card__btn" type="button"><img class="card__btn-icon" src="images/icon-cart.svg" alt="" />Add to Cart</button>
    </div>
  </main>
</body>
</html>
